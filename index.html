<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout concept: a night-shift control board. One dominant "next action" panel, timeline below,
   sodium-orange accent for the single thing to do; categories carry their own color plus a text label. */
:root {
  color-scheme: dark;
  --bg: #0e1217; --surface: #161c23; --surface-2: #1d252e; --line: #2a3440; --line-2: #36424f;
  --fg: #e9eef3; --muted: #9eabb8; --faint: #6f7d8b;
  --accent: #ff9a3c; --accent-ink: #1c1004; --accent-soft: rgba(255,154,60,.14);
  --good: #6fd08f; --warn: #f2c14e; --bad: #ff7b6b;
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 14px; --tap: 48px;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; line-height: 1.1; }
h3 { font-size: 18px; }
p { margin: 0; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; font-weight: 600; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 14px; } .tiny { font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; } .row.wrapr { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; }
.section { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .inner { max-width: 640px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.sync { font-size: 12px; color: var(--faint); margin-left: auto; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(14,18,23,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { appearance: none; border: 0; background: none; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* Cards & controls */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card.flat { background: transparent; }
.btn { appearance: none; border: 1px solid var(--line-2); background: var(--surface-2); min-height: var(--tap); padding: 0 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.good { border-color: var(--good); color: var(--good); background: transparent; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns > .btn { flex: 1 1 auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice button { appearance: none; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px; padding: 0 14px; min-height: 42px; font-weight: 700; cursor: pointer; }
.choice button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 700; }
input[type=text], input[type=number], input[type=time], input[type=date], input[type=url], select, textarea {
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; min-height: 46px; padding: 8px 12px; color: var(--fg); width: 100%; font-size: 16px; }
textarea { min-height: 90px; resize: vertical; line-height: 1.4; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: var(--tap); }
.check:last-child { border-bottom: 0; }
.box { flex: 0 0 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line-2); display: grid; place-items: center; margin-top: 1px; }
.check.on .box { background: var(--good); border-color: var(--good); }
.check.on .box::after { content: ""; width: 7px; height: 12px; border: solid #0d1a11; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
.check.on .lbl { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.lbl { flex: 1; min-width: 0; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); }
.note { border-left: 3px solid var(--line-2); padding: 8px 12px; color: var(--muted); font-size: 14px; background: var(--surface); border-radius: 0 10px 10px 0; }
.note.warn { border-color: var(--warn); color: var(--fg); }
.note.bad { border-color: var(--bad); color: var(--fg); }
.note.good { border-color: var(--good); color: var(--fg); }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 56px; cursor: pointer; }
.list-item:last-child { border-bottom: 0; }
.chev { color: var(--faint); font-size: 22px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.scrollx { overflow-x: auto; }

/* Category tags */
.cat { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.cat::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

/* Today */
.dayhead { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.daystrip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-top: 6px; }
.daystrip i { height: 8px; border-radius: 3px; background: var(--line-2); }
.daystrip i.past { background: var(--faint); }
.daystrip i.now { background: var(--accent); }
.daystrip i.off { background: transparent; border: 2px solid var(--good); }
.daystrip i.off.past { border-color: var(--faint); }
.daystrip i.off.now { background: var(--good); }
.next { border: 1px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), transparent 70%), var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.next .title { font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.05; text-wrap: balance; }
.next .when { font-family: var(--f-mono); font-size: 15px; color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.fact b { display: block; font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.fact.alert { border-color: var(--warn); }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quick button { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; min-height: 58px; padding: 6px; font-weight: 700; font-size: 14px; cursor: pointer; line-height: 1.15; }
.agenda .a { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 52px; }
.agenda .a:last-child { border-bottom: 0; }
.agenda .t { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.agenda .a .ti { min-width: 0; }
.agenda .a .ti b { font-weight: 700; display: block; font-size: 15px; }
.agenda .a.done .ti b { color: var(--muted); text-decoration: line-through; }
.agenda .a.skip .ti b { color: var(--faint); }
.agenda .a.nowline { box-shadow: inset 3px 0 0 var(--accent); padding-left: 8px; }
.st { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.st.done { color: var(--good); border-color: var(--good); }
.st.skip { color: var(--faint); }
.st.miss { color: var(--warn); border-color: var(--warn); }
.st.over { color: var(--bad); border-color: var(--bad); }

/* Calendar */
.segs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.segs button { appearance: none; border: 0; background: none; min-height: 40px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--muted); }
.segs button.on { background: var(--surface-2); color: var(--fg); }
.calnav { display: flex; align-items: center; gap: 8px; }
.calnav .ttl { flex: 1; text-align: center; min-width: 0; }
.iconbtn { appearance: none; border: 1px solid var(--line-2); background: var(--surface); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; flex: none; }
.dgrid { position: relative; margin-left: 48px; border-left: 1px solid var(--line); }
.dgrid .hr { position: absolute; left: -48px; right: 0; border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.dgrid .hr span { position: absolute; top: -8px; left: 0; width: 42px; text-align: right; background: var(--bg); }
.dgrid .hr.mid { border-top-style: dashed; border-color: rgba(42,52,64,.6); }
.dgrid .win { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,154,60,.04) 8px 16px); pointer-events: none; }
.blk { position: absolute; left: 4px; right: 4px; border-radius: 8px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-left: 4px solid var(--c); padding: 3px 8px; overflow: hidden; cursor: pointer; font-size: 13px; line-height: 1.2; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.blk .bt { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bs { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.blk.fixed { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 16%, var(--surface)) 0 10px, color-mix(in srgb, var(--c) 10%, var(--surface)) 10px 20px); }
.blk.done { opacity: .55; } .blk.done .bt::before { content: "✓ "; color: var(--good); }
.blk.skip { opacity: .3; } .blk.skip .bt { text-decoration: line-through; }
.blk.over { outline: 2px dashed var(--bad); }
.blk.drag { z-index: 10; box-shadow: 0 8px 30px rgba(0,0,0,.6); outline: 2px solid var(--accent); opacity: .95; }
.nowbar { position: absolute; left: -6px; right: 0; height: 2px; background: var(--accent); z-index: 5; pointer-events: none; }
.nowbar::before { content: ""; position: absolute; left: 0; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.dragtip { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); font-weight: 600; padding: 6px 14px; border-radius: 999px; pointer-events: none; }
.wk { display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 2px; }
.wk .h { text-align: center; font-size: 12px; font-weight: 700; padding: 4px 0; cursor: pointer; border-radius: 8px; line-height: 1.15; }
.wk .h.today { background: var(--accent-soft); color: var(--accent); }
.wk .h small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.wk .col { position: relative; background: var(--surface); border-radius: 6px; cursor: pointer; }
.wk .col .b { position: absolute; left: 1px; right: 1px; border-radius: 3px; background: var(--c); }
.wk .col .b.fx { opacity: .45; }
.wk .col .b.done { box-shadow: inset 0 0 0 2px var(--good); }
.wk .col .b.skip { opacity: .15; }
.wk .lab { position: relative; font-family: var(--f-mono); font-size: 10px; color: var(--faint); }
.wk .lab span { position: absolute; right: 2px; transform: translateY(-50%); }
.cyc .r { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.cyc .r.today { background: var(--accent-soft); border-radius: 10px; padding-left: 6px; }
.cyc .n { font-family: var(--f-mono); font-size: 20px; font-weight: 600; text-align: center; line-height: 1; }
.cyc .n small { display: block; font-size: 10px; color: var(--muted); font-family: var(--f-display); letter-spacing: .1em; margin-top: 3px; }
.cyc .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cyc .mini { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--c) 20%, transparent); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.cyc .mini.done { border-color: var(--good); }
.cyc .mini.skip { opacity: .4; text-decoration: line-through; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(4,6,9,.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 20px 20px 0 0; width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line-2); margin: 4px auto 10px; }
.sheet .shead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(62px + env(safe-area-inset-top, 0px)); box-shadow: 0 8px 24px rgba(0,0,0,.5); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 70; max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { appearance: none; border: 0; background: none; color: var(--accent-ink); font-weight: 800; text-decoration: underline; cursor: pointer; }

/* Timer */
.timer { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); text-align: center; }
.timer .big { font-family: var(--f-mono); font-size: clamp(64px, 22vw, 120px); font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.timer .ring { width: min(72vw, 300px); aspect-ratio: 1; max-width: 100%; position: relative; display: grid; place-items: center; }
.timer .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer .btns { width: 100%; max-width: 420px; }
.timer .lab { font-family: var(--f-display); font-size: 26px; font-weight: 600; max-width: 520px; }

/* Stats */
.spark { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
.spark i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.spark i.z { background: var(--line-2); }
.spark i.g { background: var(--good); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .v { font-family: var(--f-mono); font-size: 24px; font-weight: 600; line-height: 1.1; }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
.lesson-body p, .lesson-body ul { margin: 0 0 12px; }
.lesson-body ul { padding-left: 20px; }
.lesson-body li { margin-bottom: 6px; }
.q { display: flex; flex-direction: column; gap: 8px; }
.opt { appearance: none; text-align: left; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; min-height: var(--tap); font-weight: 600; cursor: pointer; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--surface)); }
.stage { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stage i { height: 6px; border-radius: 4px; background: var(--line-2); }
.stage i.on { background: var(--accent); } .stage i.done { background: var(--good); }
.setup { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: 24px; }
.sun { appearance: none; text-align: left; border: 1px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.sun.on { border-color: var(--accent); background: var(--accent-soft); }
.sun b { font-family: var(--f-display); font-size: 24px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) { .quick { grid-template-columns: repeat(6, minmax(0, 1fr)); } .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>

<script>window.SHIFTLINE_PWA=true;</script>
<script>
/* ===== Static program content: categories, template, exercise, cleaning, curriculum ===== */
const CATS = {
  work:     { label: 'Work',            short: 'WORK',  color: '#8b9ab0' },
  commute:  { label: 'Commute',         short: 'DRIVE', color: '#5f6b7c' },
  sleep:    { label: 'Sleep',           short: 'SLEEP', color: '#5a5fae' },
  exercise: { label: 'Exercise',        short: 'MOVE',  color: '#ef5d7a' },
  elec:     { label: 'Electrical study',short: 'ELEC',  color: '#f2d35e' },
  study:    { label: 'Personal study',  short: 'STUDY', color: '#9d8cf0' },
  clean:    { label: 'Cleaning',        short: 'CLEAN', color: '#3fb8a2' },

{ id:'l1', unit:'u1', title:'Voltage, current, resistance',
  body:`<p><b>Voltage (V, volts)</b> is electrical pressure: the push that makes charge move. It always exists <i>between two points</i>. A meter reading of 480&nbsp;V means 480 volts of difference between the two places the leads touch.</p>
<p><b>Current (I, amperes or amps)</b> is the flow of charge through a path. Current only flows when there is a complete loop from the source, through the load, and back.</p>
<p><b>Resistance (R, ohms, Ω)</b> is opposition to current. Copper conductors have very low resistance. Heaters and lamp filaments have more. Insulation has extremely high resistance, which is its job.</p>
<p>A water analogy helps at first: voltage is pressure, current is flow rate, resistance is how narrow the pipe is. The analogy breaks down later, so use it only as a starting point.</p>
<p><b>Units you will hear:</b> kilo (k) = 1,000. milli (m) = 1/1,000. mega (M) = 1,000,000. So 4.7&nbsp;kΩ = 4,700&nbsp;Ω, and 250&nbsp;mA = 0.25&nbsp;A. Insulation tests are often read in megohms (MΩ).</p>`,
  keys:['Voltage is measured between two points','Current needs a complete loop','Resistance opposes current; insulation is very high resistance','k = 1,000, m = 1/1,000, M = 1,000,000'],
  recall:['In your own words, what is the difference between voltage and current?','Why does current need a complete path?','Convert 2.2 kΩ to ohms.'],
  quiz:[
    {q:'What is the unit of current?', o:['Volt','Ampere','Ohm','Watt'], a:1, why:'Current is measured in amperes (amps).'},
    {q:'Voltage is best described as…', o:['The flow of charge','Opposition to flow','The difference in electrical pressure between two points','The amount of heat produced'], a:2, why:'Voltage is a difference between two points.'},
    {q:'How many ohms is 3.3 kΩ?', o:['33','330','3,300','33,000'], a:2, why:'k means 1,000, so 3.3 × 1,000 = 3,300 Ω.'},
    {q:'250 mA is how many amps?', o:['250 A','25 A','2.5 A','0.25 A'], a:3, why:'m means 1/1,000: 250 ÷ 1,000 = 0.25 A.'},
    {q:'Insulation on a conductor works because it has…', o:['Very low resistance','Very high resistance','High voltage','High current'], a:1, why:'Good insulation resists current almost completely.'},
  ]},
{ id:'l2', unit:'u1', title:'Ohm’s law',
  body:`<p>Ohm’s law ties the three together: <b>V = I × R</b>.</p>
<p>Rearranged: <b>I = V ÷ R</b> and <b>R = V ÷ I</b>. Cover the one you want in the triangle (V on top, I and R on the bottom) and the other two show you the math.</p>
<p><b>Example:</b> 120&nbsp;V across a 60&nbsp;Ω heater. I = 120 ÷ 60 = 2&nbsp;A.</p>
<p><b>Example:</b> A circuit draws 4&nbsp;A with 24&nbsp;V applied. R = 24 ÷ 4 = 6&nbsp;Ω.</p>
<p>What it tells you in the field: with voltage fixed, <b>lower resistance means more current</b>. That is why a short circuit (almost zero resistance) produces a huge current and why overcurrent devices exist.</p>
<p>Ohm’s law applies directly to resistive loads. Motors and other AC loads add effects (like impedance) you will learn later, but the basic relationship still guides your thinking.</p>`,
  keys:['V = I × R','I = V ÷ R','R = V ÷ I','Lower resistance at the same voltage means more current'],
  recall:['Write all three forms of Ohm’s law from memory.','Why does a short circuit draw so much current?'],
  quiz:[
    {q:'120 V across 60 Ω. Current?', o:['0.5 A','2 A','7,200 A','180 A'], a:1, why:'I = V ÷ R = 120 ÷ 60 = 2 A.'},
    {q:'A 10 Ω load carries 3 A. Voltage across it?', o:['3.3 V','13 V','30 V','0.3 V'], a:2, why:'V = I × R = 3 × 10 = 30 V.'},
    {q:'24 V pushes 4 A. Resistance?', o:['6 Ω','96 Ω','20 Ω','28 Ω'], a:0, why:'R = V ÷ I = 24 ÷ 4 = 6 Ω.'},
    {q:'Voltage stays the same and resistance drops. Current…', o:['Drops','Rises','Stays the same','Becomes zero'], a:1, why:'I = V ÷ R. Smaller R, bigger I.'},
    {q:'Why does a short circuit produce very high current?', o:['Voltage rises','Resistance in the path is very low','Insulation adds resistance','The load gets bigger'], a:1, why:'Almost no resistance means very high current.'},
  ]},
{ id:'l3', unit:'u1', title:'Power and energy',
  body:`<p><b>Power (P, watts)</b> is the rate of doing work: how fast energy is used. For DC and resistive loads: <b>P = V × I</b>.</p>
<p>Combined with Ohm’s law you also get <b>P = I² × R</b> and <b>P = V² ÷ R</b>.</p>
<p><b>Example:</b> A 240&nbsp;V heater drawing 10&nbsp;A uses 240 × 10 = 2,400&nbsp;W, or 2.4&nbsp;kW.</p>
<p><b>Why I²R matters:</b> heat in a conductor rises with the <i>square</i> of current. Double the current and the heating is four times as much. That is why wire size matters and why loose or undersized connections get hot.</p>
<p><b>Energy</b> is power over time: kilowatt-hours (kWh). A 2&nbsp;kW load running 3 hours uses 6&nbsp;kWh.</p>
<p><b>Horsepower:</b> motors are often rated in HP. 1&nbsp;HP is about 746&nbsp;W.</p>`,
  keys:['P = V × I','Heat in a conductor = I²R: double the current, four times the heat','kWh = kW × hours','1 HP ≈ 746 W'],

    {q:'Current through a conductor doubles. Heat in the conductor becomes…', o:['The same','Twice as much','Four times as much','Half'], a:2, why:'Heat follows I²R, so 2² = 4 times.'},
    {q:'A 1.5 kW heater runs 4 hours. Energy used?', o:['6 kWh','5.5 kWh','0.375 kWh','1.5 kWh'], a:0, why:'1.5 kW × 4 h = 6 kWh.'},
    {q:'1 horsepower is about…', o:['100 W','746 W','1,000 W','2,000 W'], a:1, why:'1 HP ≈ 746 watts.'},
  ]},
{ id:'l4', unit:'u1', title:'Series and parallel circuits',
  body:`<p><b>Series:</b> one path. The same current flows through every part. Resistances add: R<sub>T</sub> = R1 + R2 + R3. The source voltage is split across the parts, and the drops add up to the source voltage.</p>
<p>If one part opens in a series circuit, everything stops. Safety switches and stop buttons in control circuits are wired in series for exactly this reason.</p>
<p><b>Parallel:</b> multiple paths. Each branch gets the full source voltage. Branch currents add up to the total current. Total resistance is <i>less</i> than the smallest branch.</p>
<p>For two resistors: R<sub>T</sub> = (R1 × R2) ÷ (R1 + R2). Two equal resistors in parallel = half of one. For more: 1/R<sub>T</sub> = 1/R1 + 1/R2 + 1/R3…</p>
<p>Building circuits are parallel: each load gets full voltage, and turning one off does not turn the others off.</p>`,
  keys:['Series: same current, resistances add, voltage divides','Parallel: same voltage, currents add, total R is less than smallest branch','Two equal resistors in parallel = half','Stop buttons are in series'],

    {q:'In a parallel circuit, each branch gets…', o:['The same current','The full source voltage','Half the voltage','No current'], a:1, why:'Parallel branches share the same voltage.'},
    {q:'One device opens in a series circuit. The rest…', o:['Keep working','Stop working','Get brighter','Get more voltage'], a:1, why:'One path; break it and current stops everywhere.'},
    {q:'12 Ω and 6 Ω in parallel. Total?', o:['18 Ω','4 Ω','9 Ω','2 Ω'], a:1, why:'(12 × 6) ÷ (12 + 6) = 72 ÷ 18 = 4 Ω.'},
  ]},
{ id:'l5', unit:'u1', title:'AC and DC, single and three phase',
  body:`<p><b>DC (direct current)</b> flows one direction: batteries, many control and instrument systems (24&nbsp;VDC is common in plants).</p>
<p><b>AC (alternating current)</b> reverses direction many times per second. In the US the frequency is <b>60&nbsp;Hz</b>. AC is used for power distribution because transformers can step it up and down easily.</p>
<p><b>RMS:</b> the voltage we name (like 120&nbsp;V) is the RMS or “effective” value. The actual peak is about 1.414 times higher, about 170&nbsp;V for a 120&nbsp;V circuit.</p>
<p><b>Single phase</b> is what most homes use. <b>Three phase</b> uses three AC waveforms offset by 120°, giving smooth power that large motors need. Industrial sites commonly have 480&nbsp;V three-phase systems.</p>
<p>In a 480Y/277&nbsp;V wye system, line-to-line is 480&nbsp;V and line-to-neutral is 277&nbsp;V (480 ÷ 1.732). In 208Y/120&nbsp;V, line-to-line is 208 and line-to-neutral is 120.</p>`,
  keys:['US frequency is 60 Hz','Named AC voltage is RMS; peak ≈ 1.414 × RMS','Three phase = three waves 120° apart','480Y/277: 480 line-to-line, 277 line-to-neutral'],
  recall:['Why is AC used for distribution?','What is line-to-neutral voltage on a 480Y/277 system?'],
  quiz:[
    {q:'Standard AC frequency in the US?', o:['50 Hz','60 Hz','120 Hz','400 Hz'], a:1, why:'The US grid runs at 60 Hz.'},
    {q:'Approximate peak voltage of a 120 V RMS circuit?', o:['85 V','120 V','170 V','240 V'], a:2, why:'120 × 1.414 ≈ 170 V.'},
    {q:'On a 480Y/277 V system, line-to-neutral voltage is…', o:['120 V','208 V','277 V','480 V'], a:2, why:'480 ÷ 1.732 ≈ 277 V.'},
    {q:'Three phases are offset by…', o:['90°','120°','180°','60°'], a:1, why:'Three-phase waveforms are 120° apart.'},
    {q:'Which is commonly DC in a plant?', o:['24 V control/instrument power','480 V motor feeders','Lighting panels','Welding receptacles'], a:0, why:'24 VDC is common for controls and instruments.'},
  ]},
{ id:'l6', unit:'u2', title:'Electrical hazards',
  body:`<p>Electrical work has three main hazards:</p>
<ul><li><b>Shock:</b> current through the body. Small currents can disrupt the heart. Wet conditions and sweat lower skin resistance.</li>
<li><b>Arc flash:</b> an electrical arc through air that releases intense heat and light, enough to cause severe burns at a distance.</li>
<li><b>Arc blast:</b> the pressure wave from an arc, which can throw people and debris and damage hearing.</li></ul>
<p>Industrial systems can deliver large fault currents. That is why work near exposed energized parts is controlled by strict rules: approach boundaries, energized-work permits, arc-rated PPE, and qualified persons. Those boundaries are set by qualified people using the site’s procedures and studies, not guessed.</p>
<p><b>Your rules as a helper:</b> treat every conductor as energized until a qualified person has verified it is not. Stay out of barricaded areas and away from open panels unless you are authorized and directed. Never defeat a guard, interlock, lock, or tag. If something looks wrong, stop and ask.</p>
<p>Your employer’s safety procedures, your supervisor, and the site rules come first. This lesson is background, not authorization.</p>`,
  keys:['Shock, arc flash, arc blast','Treat conductors as energized until verified dead by a qualified person','Never defeat guards, locks, or tags','Stop and ask when something looks wrong'],
  recall:['Name the three main electrical hazards.','What should you do if you see an open panel without a barricade?'],
  quiz:[
    {q:'Which hazard is mainly intense heat and light from an arc?', o:['Shock','Arc flash','Ground fault','Induction'], a:1, why:'Arc flash is the thermal and light hazard.'},
    {q:'A conductor should be treated as energized until…', o:['It looks disconnected','The breaker handle is off','A qualified person has verified it is de-energized under procedure','Someone says so on the radio'], a:2, why:'Verification by a qualified person under the procedure is required.'},
    {q:'As a helper, you find a guard removed from equipment. You…', o:['Put it back yourself and keep going','Ignore it','Stop and tell your foreman or a qualified person','Run the equipment to test it'], a:2, why:'Report it. Do not work around missing protection.'},
    {q:'Who sets arc-flash and shock approach boundaries?', o:['Anyone on the crew','Qualified persons using site procedures and studies','The helper doing the task','They do not exist'], a:1, why:'Boundaries come from studies and qualified persons, not guesses.'},
  ]},
{ id:'l7', unit:'u2', title:'Lockout/tagout and meters (concepts)',
  body:`<p><b>Lockout/tagout (LOTO)</b> is the control of hazardous energy. OSHA requires employers to have written procedures, and your site will have its own.</p>
<p>The general idea: equipment is shut down, isolated from every energy source (electrical, but also stored mechanical, pneumatic, hydraulic, and capacitive energy), locked and tagged, and verified safe before work. Each worker usually applies <b>their own</b> lock, and only that person removes it.</p>
<p><b>Verifying absence of voltage</b> is done by a qualified person with a properly rated meter. A common method is “test before touch” with a live-dead-live check: prove the meter on a known live source, test the circuit, then prove the meter again. Follow your site’s exact procedure.</p>
<p><b>Meter basics:</b> voltage is measured across (in parallel with) two points. A clamp meter measures current by clamping around one conductor. Resistance and continuity are measured only on de-energized circuits. Meters carry category ratings (CAT III, CAT IV) for the environment they are rated for, and leads must be in good condition.</p>
<p>You will learn the site’s LOTO process in your training. Never work on anything under someone else’s lock, and never remove someone else’s lock.</p>`,
  keys:['LOTO controls all hazardous energy, not just electrical','Each worker uses their own lock','Live-dead-live: prove meter, test, prove meter again','Resistance and continuity: de-energized only'],
  recall:['Explain live-dead-live in one sentence.','List three kinds of stored energy besides electrical.'],
  quiz:[
    {q:'Who removes a personal lock?', o:['The foreman','Anyone with a key','The person who applied it (per procedure)','The operator'], a:2, why:'Personal locks are removed by the person who applied them, per procedure.'},
    {q:'Why prove the meter on a known live source before and after testing?', o:['To warm it up','To confirm the meter actually works, so a “dead” reading is real','To calibrate the leads','It is not needed'], a:1, why:'A broken meter reads zero. Proving it before and after catches that.'},
    {q:'Resistance should be measured…', o:['On energized circuits','Only on de-energized circuits','Only on DC','Only by clamping'], a:1, why:'Ohmmeters are used on de-energized circuits.'},
    {q:'A clamp meter around one conductor measures…', o:['Voltage','Current','Resistance','Frequency only'], a:1, why:'Clamp meters sense current from the magnetic field.'},
    {q:'Which is also hazardous energy LOTO must control?', o:['Compressed air','Paint color','Cable tags','Daylight'], a:0, why:'Pneumatic, hydraulic, mechanical, and stored electrical energy all count.'},
  ]},
{ id:'l8', unit:'u3', title:'Conductors and insulation',
  body:`<p>Most conductors are <b>copper</b>; some feeders use aluminum. Wire size in the US uses <b>AWG</b>: a <i>smaller number is a bigger wire</i>. #12 is bigger than #14. After #1 comes 1/0, 2/0, 3/0, 4/0 (“one-aught” to “four-aught”), then sizes in <b>kcmil</b> (250, 350, 500 kcmil and up).</p>
<p>Bigger wire carries more current with less heating and less voltage drop. How much current a conductor may carry (ampacity) depends on size, insulation temperature rating, conditions, and code tables. Engineers and the drawings decide sizes; you follow the spec.</p>
<p><b>Insulation</b> types have letter codes printed on the jacket, such as THHN/THWN or XHHW. The printing also shows size, voltage rating, and temperature rating. Reading the print on a cable is a quick way to learn what you are handling.</p>
<p><b>Color conventions:</b> green or bare is used for equipment grounding conductors, and white or gray for grounded (neutral) conductors. Phase colors follow common conventions (black-red-blue for 208/120, brown-orange-yellow for 480/277 are widely used), but the project specification governs. Always confirm with drawings, tags, and your foreman.</p>`,
  keys:['AWG: smaller number = bigger wire','After 4/0 comes kcmil','The jacket printing tells type, size, voltage, temperature rating','Green/bare = ground; white/gray = neutral; phase colors follow the project spec'],
  recall:['Which is bigger: #10 or #6?','What comes after 4/0?','What can you learn from the print on a cable jacket?'],
  quiz:[
    {q:'Which wire is larger?', o:['#14','#12','#10','#6'], a:3, why:'Smaller AWG number = larger wire. #6 is the largest here.'},
    {q:'After 4/0, sizes are given in…', o:['AWG','mm only','kcmil','inches'], a:2, why:'Above 4/0, sizes are in kcmil (250, 350, 500…).'},
    {q:'Green or bare conductors are used for…', o:['Phase A','Neutral','Equipment grounding','Control signals only'], a:2, why:'Green/bare identifies equipment grounding conductors.'},
    {q:'Who decides conductor size on a job?', o:['Whoever pulls the wire','The design, drawings, and specification','The helper','Whatever is on the truck'], a:1, why:'Size comes from engineering and the drawings.'},
    {q:'The best quick way to identify what a cable is…', o:['Guess by color','Read the printing on the jacket and check the tag','Smell it','Measure weight'], a:1, why:'Jacket printing plus the cable tag tells you what you have.'},
  ]},
{ id:'l9', unit:'u3', title:'Cables and cable identification',
  body:`<p>Industrial sites use many cable types. Common ones:</p>
<ul><li><b>Tray cable (TC):</b> multiconductor cable rated for installation in cable tray.</li>
<li><b>MC (metal-clad):</b> conductors inside an interlocked or continuous metal armor.</li>
<li><b>Instrument cable:</b> twisted pairs or triads, often with an overall or individual shield and a drain wire, used for low-level signals.</li>
<li><b>VFD cable:</b> shielded power cable designed for variable frequency drive outputs.</li></ul>
<p><b>Reading a description:</b> “3/C #12 w/G” means three conductors of #12 AWG with a ground. “2PR #16 TSP” means two twisted shielded pairs of #16.</p>
<p><b>Cable tags</b> carry a cable number that matches the <b>cable schedule</b>: from, to, size, type, and route. Tags usually go on both ends and sometimes at points along the route. A wrong or missing tag costs hours later, so tagging carefully is real, valued work.</p>
<p>Keep power and instrument cables separated as the drawings and specs require. Signal cables can pick up noise from power cables.</p>`,
  keys:['TC = tray cable; MC = metal-clad','“3/C #12 w/G” = 3 conductors #12 with ground','Cable numbers match the cable schedule','Keep power and instrument cables separated per spec'],
  recall:['Decode “4/C #10 w/G”.','What information is on a cable schedule?'],
  quiz:[
    {q:'“3/C #12 w/G” means…', o:['Three cables of #12','Three conductors #12 plus a ground','#3 cable, 12 conductors','3 kcmil'], a:1, why:'3/C = three conductors; w/G = with ground.'},
    {q:'A cable number on a tag should match…', o:['The purchase order','The cable schedule','The pay stub','The color code'], a:1, why:'Tags match the cable schedule entry.'},
    {q:'Why separate instrument cable from power cable?', o:['Looks neater','Power cables can induce noise into signal cables','Instrument cable is heavier','It is never required'], a:1, why:'Separation reduces electrical noise on signals.'},
    {q:'TSP stands for…', o:['Tray Support Plate','Twisted Shielded Pair','Thermal Safety Point','Three Single Phase'], a:1, why:'Twisted shielded pair, common for instrument signals.'},
  ]},
{ id:'l10', unit:'u3', title:'Cable tray and supports',
  body:`<p><b>Cable tray</b> is a support system that carries cables through a plant. Common types:</p>
<ul><li><b>Ladder tray:</b> two side rails with rungs. Good ventilation, very common for power.</li>
<li><b>Ventilated trough:</b> a bottom with openings.</li>
<li><b>Solid bottom:</b> used where cables need more protection or for some instrument runs.</li>
<li><b>Wire mesh (basket):</b> lighter duty.</li></ul>
<p><b>Fittings</b> change direction or size: horizontal and vertical elbows, tees, crosses, reducers. <b>Splice plates</b> join sections, and bonding jumpers may be required across joints per the design.</p>
<p><b>Supports</b> include trapeze hangers (threaded rod with strut), wall brackets, and structural attachments. Support spacing and load come from the design and the manufacturer, not from eyeballing.</p>
<p>Cable placement in tray follows the spec: how full it can be, which cables are in which tray, and how cables are tied or secured. Pulling or laying cable across sharp edges damages insulation; protect edges and corners.</p>`,
  keys:['Ladder, ventilated trough, solid bottom, wire mesh','Fittings: elbows, tees, crosses, reducers','Support spacing comes from the design','Protect cable from sharp edges'],
  recall:['Name four tray types.','What is a trapeze hanger?'],
  quiz:[
    {q:'Tray with two side rails and rungs is…', o:['Solid bottom','Ladder tray','Wire mesh','Trough'], a:1, why:'Rails plus rungs = ladder tray.'},
    {q:'A fitting that splits one tray run into two directions is a…', o:['Reducer','Tee','Splice plate','Hold-down clamp'], a:1, why:'A tee branches the run.'},
    {q:'Support spacing should be based on…', o:['What looks right','The design and manufacturer data','Whatever material is left','The helper’s preference'], a:1, why:'Loads and spacing are engineered.'},
    {q:'Sharp tray edges during a pull can…', o:['Speed the pull','Damage cable insulation','Improve grounding','Reduce tension'], a:1, why:'Insulation damage can cause failures later.'},
  ]},
{ id:'l11', unit:'u3', title:'Conduit and routing',
  body:`<p>Conduit protects conductors. Common types:</p>
<ul><li><b>RMC (rigid metal conduit / rigid):</b> heavy wall, threaded. Common in industrial plants.</li>
<li><b>IMC:</b> intermediate wall, threaded, lighter than rigid.</li>
<li><b>EMT:</b> thin wall, not threaded; uses set-screw or compression fittings.</li>
<li><b>PVC:</b> plastic, Schedule 40 or 80, often underground.</li>
<li><b>PVC-coated rigid:</b> used where corrosion is a concern.</li></ul>
<p><b>Common bends:</b> 90°, offset (two equal bends to shift a run), kick (single small bend), and three-point saddle (to cross an obstacle). The trade math lesson covers offset calculations.</p>
<p><b>Pulling wire:</b> fish tape or a pull string, pulling rope, wire lubricant, and a tugger for big pulls. Pulls have limits on tension and on how many degrees of bend are between pull points, set by code and spec. Keep hands clear of pulling ropes, sheaves, and the conduit mouth.</p>
<p>Many plant areas are <b>hazardous (classified) locations</b> where flammable gases or vapors may be present. Those areas require special equipment and fittings such as sealing fittings, installed exactly to the drawings. If you are unsure whether an area is classified, ask.</p>`,
  keys:['Rigid, IMC, EMT, PVC, PVC-coated','Offset, kick, saddle, 90°','Pulls have tension and bend limits','Classified areas need special fittings; ask if unsure'],
  recall:['What is the difference between rigid and EMT?','Why might a plant use PVC-coated rigid?'],
  quiz:[
    {q:'Which conduit is thin-wall and not threaded?', o:['RMC','IMC','EMT','PVC-coated rigid'], a:2, why:'EMT uses set-screw or compression fittings.'},
    {q:'Two equal bends that shift a conduit run sideways make a…', o:['90','Offset','Coupling','Seal'], a:1, why:'That is an offset.'},
    {q:'A bend used to go over a small obstacle in the middle of a run is a…', o:['Kick','Three-point saddle','Box offset','Back-to-back'], a:1, why:'A saddle crosses an obstacle.'},
    {q:'In a hazardous classified area, you are unsure which fitting to use. You…', o:['Use a standard fitting','Check the drawings and ask','Skip the fitting','Use tape'], a:1, why:'Classified areas require exact, specified equipment.'},
  ]},
{ id:'l12', unit:'u3', title:'Grounding and bonding',
  body:`<p>These two words are related but different.</p>
<p><b>Grounding</b> means connecting to the earth. Plants often have a buried ground grid with ground rods, and equipment and structures are connected to it. Earth connections help with lightning and stabilize system voltage.</p>
<p><b>Bonding</b> means connecting metal parts together so they stay at the same potential and form a <b>low-impedance path</b> for fault current back to the source.</p>
<p>That fault path is what makes a breaker or fuse open quickly when a hot conductor touches a metal enclosure. The earth itself is a poor conductor. A ground rod alone usually cannot carry enough fault current to trip a breaker, which is why the <b>equipment grounding conductor</b> (the green or bare wire) and bonding matter so much.</p>
<p>Connections are made with lugs, compression connectors, and exothermic welds (often called by a brand name). Each must be clean, tight, and installed per the spec. A loose ground connection can hide for years and fail when it is needed most.</p>`,
  keys:['Grounding = connection to earth','Bonding = connecting metal parts into a low-impedance fault path','The fault path back to the source trips the breaker','Earth alone usually cannot trip a breaker'],
  recall:['Explain grounding vs bonding to a new helper.','Why does the equipment grounding conductor matter if there is a ground rod?'],
  quiz:[
    {q:'Bonding mainly creates…', o:['A path to the sky','A low-impedance path for fault current back to the source','Higher voltage','More resistance'], a:1, why:'Bonding ties metal together into a fault return path.'},
    {q:'Why can’t a ground rod alone be counted on to trip a breaker?', o:['Earth is a relatively poor conductor','Rods are too short','Breakers ignore ground','It always can'], a:0, why:'Earth resistance limits fault current.'},
    {q:'What makes the breaker open fast during a fault to an enclosure?', o:['High fault current through the bonding/grounding path','The color of the wire','The ground grid alone','The tray'], a:0, why:'A good low-impedance path lets enough current flow to trip the device.'},
    {q:'A loose ground connection is dangerous because…', o:['It is noisy','It can fail to carry fault current when needed','It increases voltage','It is never dangerous'], a:1, why:'It may not carry fault current safely.'},
  ]},
{ id:'l13', unit:'u4', title:'Three-phase motors',
  body:`<p>Most industrial motors are <b>three-phase induction motors</b>. Three-phase current creates a rotating magnetic field in the stator, which drags the rotor around.</p>
<p><b>Synchronous speed</b> = 120 × frequency ÷ number of poles. At 60&nbsp;Hz a 4-pole motor’s field turns 1,800&nbsp;RPM. The rotor turns slightly slower (for example 1,770&nbsp;RPM). That difference is called <b>slip</b>.</p>
<p><b>Nameplate</b> information you will see: horsepower, voltage, full-load amps (FLA), RPM, frequency, phase, frame size, service factor, insulation class, and enclosure type. A service factor of 1.15 means the motor can handle 115% of rated load under the conditions listed by the manufacturer.</p>
<p><b>Rotation</b> of a three-phase motor reverses when any two of the three supply leads are swapped. That is why motors are “bumped” to check rotation before coupling to equipment. Bumping and terminating motors is done by qualified people under procedure.</p>
<p><b>Starting current</b> (inrush) is several times the running current, which is part of why motor protection is set the way it is.</p>`,
  keys:['Synchronous speed = 120 × f ÷ poles','4-pole at 60 Hz = 1,800 RPM; actual a bit less (slip)','Swap any two leads to reverse rotation','Starting current is several times running current'],
  recall:['Calculate synchronous speed of a 2-pole motor at 60 Hz.','What does FLA mean?'],
  quiz:[
    {q:'Synchronous speed of a 4-pole motor at 60 Hz?', o:['900 RPM','1,200 RPM','1,800 RPM','3,600 RPM'], a:2, why:'120 × 60 ÷ 4 = 1,800 RPM.'},
    {q:'A 2-pole motor at 60 Hz?', o:['1,800 RPM','3,600 RPM','7,200 RPM','900 RPM'], a:1, why:'120 × 60 ÷ 2 = 3,600 RPM.'},
    {q:'How do you reverse a three-phase induction motor?', o:['Swap any two supply leads','Reverse the ground','Lower the voltage','Change the frame'], a:0, why:'Swapping two phases reverses the rotating field.'},
    {q:'FLA on a nameplate stands for…', o:['Field Level Adjustment','Full-Load Amps','Frame Locking Angle','Fault Limit Ampacity'], a:1, why:'Full-load amps.'},
    {q:'Slip is…', o:['Belt slipping','The difference between synchronous speed and actual rotor speed','A wiring error','A type of fault'], a:1, why:'Induction motors run slightly below synchronous speed.'},
  ]},
{ id:'l14', unit:'u4', title:'Motor control components',
  body:`<p>A typical motor circuit has several parts, each with one job:</p>
<ul><li><b>Disconnect:</b> a switch to isolate the motor for maintenance (and to lock out).</li>
<li><b>Short-circuit and ground-fault protection:</b> fuses or a circuit breaker that open fast on very high current.</li>
<li><b>Contactor:</b> an electrically operated switch. A low-voltage coil pulls in the main contacts to start the motor.</li>
<li><b>Overload relay:</b> protects the motor from overheating due to sustained overcurrent (overloading, a jammed load, losing a phase). It trips by opening a contact in the control circuit, which drops out the contactor.</li>
<li><b>Control transformer:</b> steps line voltage down for the control circuit (120&nbsp;V is common).</li></ul>
<p>A <b>starter</b> is a contactor plus an overload relay. A <b>relay</b> is like a small contactor used for control logic rather than motor current.</p>
<p>Key distinction: <b>overloads do not protect against short circuits</b>, and fuses or breakers sized for short-circuit protection do not by themselves protect a motor from slow overheating. The two work together.</p>`,
  keys:['Contactor = electrically operated switch','Starter = contactor + overload relay','Overload protects the motor from overheating; breaker/fuse handles short circuits','Overload trips by opening the control circuit'],
  recall:['What is the difference between a contactor and a relay?','What does an overload relay actually open when it trips?'],
  quiz:[
    {q:'A starter is…', o:['A breaker','A contactor plus an overload relay','A transformer','A motor'], a:1, why:'Starter = contactor + overload relay.'},
    {q:'Which device protects the motor against sustained overcurrent heating?', o:['Overload relay','Disconnect','Pushbutton','Cable tray'], a:0, why:'Overload relays protect against overheating.'},
    {q:'When an overload trips, it typically…', o:['Opens the main power directly','Opens a contact in the control circuit so the contactor drops out','Blows a fuse','Reverses the motor'], a:1, why:'The overload contact is in series with the coil circuit.'},
    {q:'Protection against a short circuit comes from…', o:['The overload relay','Fuses or a circuit breaker','The start button','The nameplate'], a:1, why:'Short-circuit protection is the fuse or breaker.'},
    {q:'A control transformer is used to…', o:['Raise motor voltage','Provide lower voltage for the control circuit','Measure current','Ground the motor'], a:1, why:'It steps down voltage for controls.'},
  ]},
{ id:'l15', unit:'u4', title:'Basic control circuits (ladder diagrams)',
  body:`<p>Control circuits are drawn as <b>ladder diagrams</b>: two vertical rails (control power, often labeled L1 and L2 or X1 and X2) with horizontal <b>rungs</b>. Each rung has inputs (buttons, switches, contacts) on the left and an output (coil, light) on the right.</p>
<p><b>NO (normally open)</b> contacts are open when not activated. <b>NC (normally closed)</b> contacts are closed when not activated. “Normal” means the de-energized, at-rest state.</p>
<p><b>Three-wire start/stop:</b> an NC stop button in series, then an NO start button, then the contactor coil (M). An NO auxiliary contact from M is wired <b>in parallel with the start button</b>. Press start, the coil energizes, the M contact closes and “seals in” the circuit, so the motor keeps running after you let go. Press stop and the circuit breaks.</p>
<p>The overload contact is also in series with the coil. If power is lost, the coil drops out and the motor will not restart on its own when power returns. This is called <b>low-voltage protection</b>.</p>
<p>With <b>two-wire control</b> (a maintained switch such as a float or thermostat), the motor restarts automatically when power returns.</p>`,
  keys:['Rails and rungs; inputs left, outputs right','NO/NC describes the at-rest state','Seal-in contact is in parallel with start','Stop and overload contacts are in series with the coil'],
  recall:['Draw (on paper) a three-wire start/stop circuit from memory.','Why doesn’t a three-wire circuit restart after a power loss?'],
  quiz:[
    {q:'In a three-wire start/stop circuit, the seal-in contact is wired…', o:['In series with stop','In parallel with the start button','In parallel with the coil','To ground'], a:1, why:'It bypasses the start button once the coil pulls in.'},
    {q:'A stop button is usually…', o:['NO, in parallel','NC, in series','NO, in series','NC, in parallel'], a:1, why:'NC in series so pressing it breaks the circuit.'},
    {q:'“Normally open” means…', o:['Open when the device is at rest/not activated','Open when energized','Always open','Open during faults'], a:0, why:'Normal = at-rest state.'},
    {q:'After a power outage, a three-wire control circuit…', o:['Restarts by itself','Stays off until someone presses start','Reverses','Trips the breaker'], a:1, why:'This is low-voltage protection.'},
    {q:'On a ladder diagram, the coil is usually drawn…', o:['On the left','On the right side of the rung','On the rail','Not shown'], a:1, why:'Outputs go on the right.'},
  ]},
{ id:'l16', unit:'u5', title:'Reading electrical drawings',
  body:`<p>A drawing set is how the engineers talk to the field. The main types:</p>
<ul><li><b>One-line (single-line) diagram:</b> shows how power flows from source to loads: transformers, switchgear, MCCs, breakers. One line represents all phases.</li>
<li><b>Schematic / elementary:</b> shows how a control circuit <i>works</i>, usually as a ladder diagram.</li>
<li><b>Wiring / interconnection diagram:</b> shows physical terminal-to-terminal connections, with wire numbers and terminal numbers.</li>
<li><b>Plan / layout drawings:</b> show where equipment, tray, and conduit go on the site.</li>
<li><b>Details:</b> how a specific item is installed (a support, a grounding connection).</li>
<li><b>Schedules:</b> tables, like the cable schedule and panel schedules.</li></ul>
<p>Start with the <b>title block</b> (drawing number, revision, status) and the <b>legend and symbol sheet</b>. Make sure you are using the current revision; revision clouds and triangles mark what changed. Field markups showing changes (often called redlines) feed the as-built drawings.</p>
<p>When a drawing and the field do not match, do not guess. Show your foreman.</p>`,
  keys:['One-line = power flow','Schematic = how control works','Wiring diagram = physical terminals','Check title block, revision, and legend first'],
  recall:['Which drawing would you use to land a wire on a terminal?','What do revision clouds show?'],
  quiz:[
    {q:'Which drawing shows how power flows from the transformer to the MCC?', o:['Wiring diagram','One-line diagram','Detail','Cable schedule'], a:1, why:'One-lines show the power distribution path.'},
    {q:'To find which terminal a wire lands on, use the…', o:['One-line','Plan view','Wiring/interconnection diagram','Title block'], a:2, why:'Wiring diagrams show terminal-to-terminal connections.'},
    {q:'Revision clouds mark…', o:['Weather','What changed in this revision','Grounding','Hazard areas'], a:1, why:'They highlight changes.'},
    {q:'The drawing does not match what is in the field. You…', o:['Do what seems right','Show your foreman before proceeding','Ignore the drawing','Redraw it yourself'], a:1, why:'Raise mismatches. Do not guess.'},

{ id:'l17', unit:'u5', title:'On the job: tools, terms, asking well',
  body:`<p><b>Common tools you will see:</b> portable band saw, pipe threader, hand and hydraulic benders, reamers, fish tapes, tuggers and pulling rope, strippers, crimpers and compression tools, torque wrenches, levels, tape measures, label printers. Insulation-resistance testers (often called meggers) and other test equipment are used by trained, authorized people.</p>
<p><b>Terms:</b> <i>home run</i> (the circuit run back to its panel), <i>termination</i> (landing a conductor on its terminal), <i>pull</i> (installing cable), <i>MCC</i> (motor control center), <i>JB</i> (junction box), <i>stub-up</i>, <i>strut</i>, <i>as-builts</i>, <i>punch list</i>.</p>
<p><b>Understand the why:</b> when you get a task, ask yourself what system it is part of and what happens next. Tagging a cable makes termination possible. Supporting tray correctly keeps it from sagging under load.</p>
<p><b>Ask well:</b> say what you were told, what you see, and what you think the question is. “You said run this to JB-104, but the drawing shows JB-105 on rev 3. Which one?” A good question saves rework and shows you understand.</p>
<p><b>Stop and ask</b> when a task is new to you, involves anything that might be energized, does not match the drawing, or you are not sure you are authorized.</p>`,
  keys:['Learn the purpose behind each task','Ask with: what I was told, what I see, my question','Stop and ask for new, energized, mismatched, or unauthorized work'],
  recall:['Write one good question you could ask your foreman this week.','What is a home run?'],
  quiz:[
    {q:'A “termination” is…', o:['Ending your shift','Landing a conductor on its terminal','Cutting cable','A fired worker'], a:1, why:'Termination means connecting a conductor to its terminal.'},
    {q:'MCC stands for…', o:['Main Cable Conduit','Motor Control Center','Master Circuit Contactor','Metal Clad Cable'], a:1, why:'Motor control center.'},
    {q:'Best way to ask a question on site:', o:['“What do I do?”','State what you were told, what you see, and your exact question','Wait until someone notices','Guess'], a:1, why:'Specific questions get specific answers fast.'},
    {q:'You should stop and ask when…', o:['The task is new or might involve energized parts','You are tired of a task','It is lunch','Never'], a:0, why:'New, possibly energized, or unclear tasks need a qualified person’s direction.'},

{ id:'l18', unit:'u6', title:'Trade math: offsets and measurements',
  body:`<p><b>Tape fractions:</b> know 1/16 to 1/2 by sight, and decimals: 1/8 = 0.125, 1/4 = 0.25, 3/8 = 0.375, 1/2 = 0.5, 5/8 = 0.625, 3/4 = 0.75, 7/8 = 0.875.</p>
<p><b>Offset multipliers:</b> distance between bend marks = offset depth × multiplier.</p>
<table class="tbl"><tr><th>Angle</th><th>Multiplier</th><th>Shrink per inch of offset</th></tr>
<tr><td>10°</td><td>6.0</td><td>1/16″</td></tr>
<tr><td>22½°</td><td>2.6</td><td>3/16″</td></tr>
<tr><td>30°</td><td>2.0</td><td>1/4″</td></tr>
<tr><td>45°</td><td>1.414</td><td>3/8″</td></tr>
<tr><td>60°</td><td>1.2</td><td>1/2″</td></tr></table>
<p><b>Example:</b> a 6″ offset with 30° bends: marks 6 × 2 = 12″ apart. Shrink = 6 × 1/4 = 1½″, so the run gets 1½″ shorter.</p>
<p>30° is a common choice because the multiplier (2) is easy to remember and the shrink is moderate. Bender marks and methods vary, so learn your crew’s bender from someone who knows it.</p>`,
  keys:['30°: ×2, shrink 1/4″ per inch','45°: ×1.414, shrink 3/8″ per inch','10°: ×6, 22½°: ×2.6, 60°: ×1.2','Know fraction-decimal conversions'],
  recall:['What is the multiplier and shrink for a 30° offset?','Convert 5/8 to a decimal.'],

    {q:'10″ offset with 45° bends. Distance between marks?', o:['10″','12″','14.14″','20″'], a:2, why:'10 × 1.414 ≈ 14.14″.'},

{ id:'l19', unit:'u6', title:'The path: helper to journeyman',
  body:`<p>In Texas, electricians are licensed by <b>TDLR</b> (Texas Department of Licensing and Regulation). Licenses include apprentice, journeyman, and master, and there is a <b>Journeyman Industrial Electrician</b> license specific to industrial work.</p>
<p>According to TDLR, the Journeyman Industrial license requires <b>8,000 hours of on-the-job training as a licensed electrical apprentice</b> under a Texas-licensed master electrician, verified by your supervisors, and then passing the exam. Rules and fees change, so always check the current requirements on the TDLR website.</p>
<p><b>Practical steps now:</b></p>
<ul><li>Ask your employer whether your helper role should be registered as an apprentice license with TDLR, and whether they sponsor apprentice training.</li>
<li>Keep your own record of hours, tasks, and what you learned. It helps when verifying experience later.</li>
<li>Look into structured programs: union JATC programs and merit-shop programs (for example through ABC or IEC chapters) offer classroom training alongside work.</li>
<li>Keep studying the basics in this app. Apprenticeship classes build on Ohm’s law, code navigation, motors, and controls.</li></ul>
<p>Being reliable is part of the path. Showing up every scheduled day is what lets people trust you with more.</p>`,

/* ===== Engine: dates, state, persistence, schedule builder ===== */
const LS_KEY = 'shiftline.v1';
const DAY = 1440;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => { const A = parseISO(a), B = parseISO(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); };
const tm = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const uid = () => Math.random().toString(36).slice(2, 9);
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* Op-day minutes: an "op day" runs from noon to noon. 720 = 12:00 PM, 1440 = midnight, 1530 = 1:30 AM next morning. */
function fmt(m, opts) {
  m = Math.round(m); let mm = ((m % DAY) + DAY) % DAY; let h = Math.floor(mm / 60), mi = mm % 60;
  const ap = h >= 12 ? 'PM' : 'AM'; let h12 = h % 12; if (h12 === 0) h12 = 12;
  if (opts === 'short') return mi ? `${h12}:${pad(mi)}${ap === 'AM' ? 'a' : 'p'}` : `${h12}${ap === 'AM' ? 'a' : 'p'}`;
  return `${h12}:${pad(mi)} ${ap}`;
}
const toHHMM = m => { const mm = ((Math.round(m) % DAY) + DAY) % DAY; return `${pad(Math.floor(mm / 60))}:${pad(mm % 60)}`; };
const fromInput = v => { let m = tm(v); if (m < 720) m += DAY; return m; }; // times before noon belong to the late part of the op day
const fmtDur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const dateLabel = (s, long) => { const d = parseISO(s); return long ? `${WDL[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}` : `${WD[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const absTime = (s, m) => { const d = parseISO(s); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, m).getTime(); };
function nowInfo(now) {
  now = now || new Date(); const t = iso(now);
  const cut = 9 * 60; const mins = now.getHours() * 60 + now.getMinutes();
  const op = mins < cut ? addDays(t, -1) : t;
  const opMin = Math.round((now.getTime() - absTime(op, 0)) / 60000);
  return { op, opMin, ts: now.getTime() };
}

/* ---------- State ---------- */
function defaultState() {
  return {
    v: 1, savedAt: 0,
    setup: { done: false, offSunday: null },
    settings: {
      wake: '12:30', bed: '04:45', arriveReg: '16:00', shiftRegStart: '16:30', shiftRegEnd: '03:00', homeReg: '03:30',
      arriveSun: '14:00', shiftSunStart: '14:30', shiftSunEnd: '23:00', homeSun: '23:30',
      commute: 30, commuteSet: false, prepMin: 30, wakeMin: 20, catMin: 10, gapMin: 5, windMin: 45,
      offWindowEnd: '23:00', cats: 'Loki and Sylvie', equipment: 'No equipment (home)', tiers: { ...DEFAULT_TIER },
    },
    template: JSON.parse(JSON.stringify(DEFAULT_TEMPLATE)),
    ov: {}, events: [],
    att: {}, ready: {}, checkins: {}, reviews: {}, cycleReviews: {}, care: {}, recovery: {},
    ex: { level: 1, logs: [] },
    elec: { done: {}, best: {}, qs: {}, notes: {}, sessions: [], current: 'l1' },
    study: { subjects: [] },
    clean: { rec: {}, maint: {}, sessions: [], mode: 'recovery' },
    lotus: { logs: [], alts: DEFAULT_ALTS.slice(), goal: { mode: 'reduce', perDay: 2, quitDate: '' }, cost: 0, baseline: 0, contact: '' },
    timer: null, missedSeen: {},
  };
}
let S = loadLocal() || defaultState();
function migrate(x) {
  const d = defaultState();
  for (const k of Object.keys(d)) if (x[k] === undefined) x[k] = d[k];
  for (const k of Object.keys(d.settings)) if (x.settings[k] === undefined) x.settings[k] = d.settings[k];
  for (const k of ['ex', 'elec', 'clean', 'lotus']) for (const kk of Object.keys(d[k])) if (x[k][kk] === undefined) x[k][kk] = d[k][kk];
  return x;
}
function loadLocal() { try { const r = localStorage.getItem(LS_KEY); return r ? migrate(JSON.parse(r)) : null; } catch (e) { return null; } }
let saveT = null, cloudT = null;
function save() {
  S.savedAt = Date.now();
  saveLocal();
  clearTimeout(cloudT); cloudT = setTimeout(pushCloud, 3000);
}
let storageOK = true;
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
function pruneState() {
  const cutoff = addDays(iso(new Date()), -120);
  for (const k of Object.keys(S.ov)) { const d = k.split('@')[1]; if (d && d < cutoff && (!S.ov[k].date || S.ov[k].date < cutoff)) delete S.ov[k]; }
  for (const k of ['care', 'ready', 'missedSeen']) for (const d of Object.keys(S[k])) if (d < cutoff) delete S[k][d];
  const lc = Date.now() - 400 * 864e5; S.lotus.logs = S.lotus.logs.filter(l => l.ts > lc);
}

/* ---------- Cloud sync (only inside a claude.ai artifact; the standalone app keeps data on the device) ---------- */
let cloudRef = null; let syncState = 'local';
async function initCloud() {
  try {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudRef = db.doc('data/users/' + id + '/state');
    const snap = await cloudRef.get();
    if (snap.exists) {
      const d = snap.data(); const remote = JSON.parse(d.json || '{}');
      if (remote && remote.savedAt && remote.savedAt > (S.savedAt || 0)) { S = migrate(remote); saveLocal(); if (typeof render === 'function') render(); }
      else if ((S.savedAt || 0) > (remote.savedAt || 0)) pushCloud();
    } else if (S.setup.done) pushCloud();
    syncState = 'synced'; if (typeof renderSyncBadge === 'function') renderSyncBadge();
  } catch (e) { syncState = 'local'; }
}
let pushing = false, pushAgain = false;
async function pushCloud() {
  if (!cloudRef) return; if (pushing) { pushAgain = true; return; }
  pushing = true;
  try {
    const json = JSON.stringify(S);
    if (json.length > 240000) { pruneState(); }
    await cloudRef.set({ json: JSON.stringify(S), savedAt: S.savedAt });
    syncState = 'synced';
  } catch (e) { syncState = 'error'; }
  pushing = false; if (typeof renderSyncBadge === 'function') renderSyncBadge();
  if (pushAgain) { pushAgain = false; pushCloud(); }
}

/* ---------- Cycle ---------- */
function cycleDay(s) {
  if (!S.setup.offSunday) return null;
  const diff = daysBetween(S.setup.offSunday, s); const c = ((diff % 14) + 14) % 14;
  return c === 0 ? 14 : c;
}
const isWork = c => c !== 14;
const isSunWork = c => c === 7;
function cycleStart(s) { const c = cycleDay(s); return addDays(s, -(c - 1)); }
function shiftFor(c) {
  const st = S.settings;
  if (!isWork(c)) return null;
  if (isSunWork(c)) { const s = tm(st.shiftSunStart); let e = tm(st.shiftSunEnd); if (e <= s) e += DAY; let h = tm(st.homeSun); if (h < s) h += DAY; return { start: s, end: e, arrive: tm(st.arriveSun), home: h, label: `${fmt(s, 'short')}–${fmt(e, 'short')}` }; }
  const s = tm(st.shiftRegStart); let e = tm(st.shiftRegEnd); if (e <= s) e += DAY; let h = tm(st.homeReg); if (h < s) h += DAY;
  return { start: s, end: e, arrive: tm(st.arriveReg), home: h, label: `${fmt(s, 'short')}–${fmt(e, 'short')}` };
}
const bedMin = () => { const b = tm(S.settings.bed); return b < 720 ? b + DAY : b; };
const wakeMin = () => tm(S.settings.wake);
function departFor(c) { const sh = shiftFor(c); return sh ? sh.arrive - (+S.settings.commute || 0) : null; }

/* ---------- Building a day ---------- */
const tierOf = cat => (S.settings.tiers && S.settings.tiers[cat]) || DEFAULT_TIER[cat] || 3;
const ovOf = k => S.ov[k] || {};
function mk(key, o) { const ov = S.ov[key] || {}; return Object.assign({ key, status: ov.status || null, reason: ov.reason || '', note: ov.note || '', tier: tierOf(o.cat) }, o); }

const _cache = new Map(); let _cacheVer = 0;
function invalidate() { _cache.clear(); }
function buildDay(s) {
  if (_cache.has(s)) return _cache.get(s);
  const c = cycleDay(s); const st = S.settings; const W = wakeMin(), B = bedMin();
  const sh = shiftFor(c);
  const fixed = [];
  const ws = W + (+st.wakeMin), cs = ws + (+st.catMin);
  fixed.push(mk('fx_wake@' + s, { title: 'Wake up: water, bathroom, eat, teeth, dressed, review the day', cat: 'hygiene', start: W, dur: +st.wakeMin, kind: 'wake', fixed: true }));
  fixed.push(mk('fx_cat@' + s, { title: `Cat care: scoop litter, food, water (${st.cats})`, cat: 'clean', start: ws, dur: +st.catMin, kind: 'cat', fixed: true, tier: 1 }));
  const windows = []; let depart = null, prep = null;
  if (sh) {
    depart = sh.arrive - (+st.commute || 0); prep = depart - (+st.prepMin);
    fixed.push(mk('fx_prep@' + s, { title: 'Eat + pack for work: food, water, clothes, keys, wallet, phone', cat: 'meal', start: prep, dur: +st.prepMin, kind: 'prep', fixed: true }));
    if (+st.commute > 0) fixed.push(mk('fx_drive@' + s, { title: 'Drive to site', cat: 'commute', start: depart, dur: +st.commute, kind: 'drive', fixed: true, hard: true }));
    if (sh.start > sh.arrive) fixed.push(mk('fx_onsite@' + s, { title: 'On site, gear up', cat: 'work', start: sh.arrive, dur: sh.start - sh.arrive, kind: 'onsite', fixed: true, hard: true }));
    fixed.push(mk('fx_work@' + s, { title: isSunWork(c) ? 'Shift (working Sunday, 30-min lunch)' : 'Shift', cat: 'work', start: sh.start, dur: sh.end - sh.start, kind: 'work', fixed: true, hard: true }));
    fixed.push(mk('fx_home@' + s, { title: 'Head home', cat: 'commute', start: sh.end, dur: Math.max(10, sh.home - sh.end), kind: 'home', fixed: true, hard: true }));
    windows.push([cs, prep]);
    if (isSunWork(c)) {
      windows.push([sh.home + 15, B - (+st.windMin)]);
      fixed.push(mk('fx_wind@' + s, { title: 'Wind down: shower, snack, phone away', cat: 'rest', start: B - (+st.windMin), dur: +st.windMin, kind: 'wind', fixed: true }));
    } else {
      fixed.push(mk('fx_wind@' + s, { title: 'Wind down: shower, snack, phone away (nothing hard)', cat: 'rest', start: sh.home, dur: Math.max(15, B - sh.home), kind: 'wind', fixed: true }));
    }
  } else {
    windows.push([cs, Math.max(cs + 60, fromInput(st.offWindowEnd))]);
    fixed.push(mk('fx_wind@' + s, { title: 'Wind down: shower, snack, phone away', cat: 'rest', start: B - (+st.windMin), dur: +st.windMin, kind: 'wind', fixed: true }));
  }
  fixed.push(mk('fx_sleep@' + s, { title: 'Sleep (protected)', cat: 'sleep', start: B, dur: W + DAY - B, kind: 'sleep', fixed: true, hard: true }));

  // template instances
  let items = [];
  for (const t of S.template) {
    if (!t.days || !t.days.includes(c) || t.paused) continue;
    const key = t.id + '@' + s; const o = S.ov[key] || {};
    if (o.date && o.date !== s) continue;
    items.push(instOf(t, key, o, s));
  }
  // moved in from other days
  for (const k of Object.keys(S.ov)) {
    const o = S.ov[k]; if (o.date !== s) continue; const [tid, d0] = k.split('@'); if (d0 === s) continue;
    const t = S.template.find(x => x.id === tid); if (!t) continue;
    items.push(instOf(t, k, o, s, d0));
  }
  // events
  const evs = [];
  for (const e of S.events) {
    if (!occurs(e, s)) continue;
    const key = e.id + '@' + s; const o = S.ov[key] || {};
    if (o.date && o.date !== s) continue;
    evs.push(mk(key, { title: e.title, cat: e.cat, start: o.start != null ? o.start : e.start, dur: o.dur || e.dur, kind: 'event', ev: e.id, fixed: !!e.fixed, alcohol: e.alcohol, tier: e.tier || tierOf(e.cat), src: 'event' }));
  }
  for (const k of Object.keys(S.ov)) { const o = S.ov[k]; if (o.date !== s) continue; const [eid, d0] = k.split('@'); if (d0 === s) continue; const e = S.events.find(x => x.id === eid); if (!e) continue; evs.push(mk(k, { title: e.title, cat: e.cat, start: o.start, dur: o.dur || e.dur, kind: 'event', ev: e.id, fixed: !!e.fixed, alcohol: e.alcohol, tier: e.tier || tierOf(e.cat), src: 'event', from: d0 })); }

  // placement
  const occ = [];
  const occupy = b => { if (b.status !== 'skip') occ.push([b.start, b.start + b.dur]); };
  fixed.forEach(occupy); evs.forEach(occupy);
  const pinned = items.filter(i => i.start != null), floating = items.filter(i => i.start == null);
  pinned.forEach(occupy);
  floating.sort((a, b) => a.order - b.order);
  const gap = +st.gapMin || 0; let over = 0;
  const rec = S.recovery[s]; const minStart = rec && rec.resumeAt ? rec.resumeAt : 0;
  for (const it of floating) {
    let placed = null;
    for (const [a, b] of windows) {
      let t = Math.max(a, minStart);
      while (t + it.dur <= b) {
        const near = occ.find(([x, y]) => t < y + gap && t + it.dur > x - gap);
        if (!near) { placed = t; break; }
        t = near[1] + gap;
      }
      if (placed != null) break;
    }
    if (placed == null) { // does not fit: place after the last item in the first window and flag it
      const w0 = windows[0] || [cs, cs];
      const ends = occ.filter(([x, y]) => y > w0[0] && x < w0[1]).map(([, y]) => y);
      placed = Math.max(w0[0], minStart, ...ends) + gap; it.overflow = true; over += it.dur;
    }
    it.start = placed; occupy(it);
  }
  const blocks = [...fixed, ...items, ...evs].sort((a, b) => a.start - b.start || (a.fixed ? -1 : 1));
  const free = windows.reduce((n, [a, b]) => n + Math.max(0, b - a), 0);
  const planned = items.filter(i => i.status !== 'skip').reduce((n, i) => n + i.dur, 0) + evs.filter(e => e.status !== 'skip').reduce((n, e) => n + e.dur, 0);
  const day = { s, c, work: !!sh, sunWork: isSunWork(c), sh, blocks, windows, depart, prep, over, free, planned };
  _cache.set(s, day); return day;
}
function instOf(t, key, o, s, from) {
  const short = !!o.short; const dur = o.dur || (short ? t.short || Math.round(t.dur / 2) : t.dur);
  return mk(key, { title: (short ? 'Short: ' : '') + t.title, cat: t.cat, start: o.start != null ? o.start : null, dur, kind: t.kind, tpl: t.id, order: t.order || 50, short, src: 'tpl', from, tier: t.tier || tierOf(t.cat), baseDur: t.dur });
}
function occurs(e, s) {
  if (e.date === s) return true; if (!e.repeat || e.repeat === 'none' || s < e.date) return false;
  if (e.until && s > e.until) return false;
  const d = daysBetween(e.date, s);

let timerTick = null; let audioCtx = null;
function startTimer(label, min, day, key) {
  S.timer = { label, day, key, durMs: min * 60000, startTs: Date.now(), paused: null, done: false }; save();
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch (e) { }
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { }
  closeSheet(true); renderTimer();
}
function timerRemain() { const t = S.timer; if (!t) return 0; const el = t.paused != null ? t.paused : Date.now() - t.startTs; return t.durMs - el; }
function beep() { try { if (!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .4); } catch (e) { } }
function renderTimer() {
  let r = $('#timer'); if (!r) return;
  clearInterval(timerTick);
  const t = S.timer; if (!t) { r.innerHTML = ''; return; }
  const draw = () => {
    const rem = timerRemain(); const over = rem <= 0;
    if (over && !t.done) { t.done = true; beep(); save(); }
    const m = Math.floor(Math.abs(rem) / 60000), s = Math.floor(Math.abs(rem) % 60000 / 1000);
    const frac = Math.max(0, Math.min(1, 1 - rem / t.durMs)); const C = 2 * Math.PI * 46;
    r.innerHTML = `<div class="timer" role="dialog" aria-label="Focus timer"><span class="eyebrow">${over ? 'Time is up' : t.paused != null ? 'Paused' : 'Focus'}</span>
      <div class="lab">${esc(t.label)}</div>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="50" cy="50" r="46" fill="none" stroke="${over ? 'var(--good)' : 'var(--accent)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>
      <div class="big">${over ? '+' : ''}${m}:${pad(s)}</div></div>
      <p class="muted small">${over ? 'Nice. Mark it done, or add a few minutes.' : 'Just this one thing. Phone face down if you can.'}</p>
      <div class="btns">${t.paused != null ? '<button type="button" class="btn" data-a="tResume">Resume</button>' : '<button type="button" class="btn" data-a="tPause">Pause</button>'}<button type="button" class="btn" data-a="tAdd">+5 min</button></div>
      <div class="btns"><button type="button" class="btn good" data-a="tDone">Done</button><button type="button" class="btn ghost" data-a="tStop">Stop</button></div></div>`;
  };

  ${body}
  <div class="section"><span class="eyebrow">Program</span><div class="card stack-s small">
    <p>3 short strength sessions per week (Mon, Wed, Fri), walks or mobility on the other days, a light walk on working Sundays, and a longer session on your Sunday off if your body is up for it.</p>
    <p class="muted">Levels go up only when sessions feel controlled and pain stays low. ${S.ex.level > 1 ? '' : 'Start here even if it feels easy; consistency first.'}</p>
    <div class="btns">${S.ex.level > 1 ? '<button type="button" class="btn sm" data-a="exLevel" data-n="-1">Go back a level</button>' : ''}<button type="button" class="btn sm" data-a="exKind" data-k="${x.kind === 'strength' ? 'mobility' : 'strength'}">Switch to ${x.kind === 'strength' ? 'mobility day' : 'strength day'}</button></div></div></div>

};
