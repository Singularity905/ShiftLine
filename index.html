/* ---------- Electrical ---------- */
function lessonStatus(id) { const b = S.elec.best[id]; return b == null ? 'new' : b >= 80 ? 'mastered' : 'review'; }
function currentLesson() { const c = ELEC.find(l => lessonStatus(l.id) !== 'mastered'); return c || ELEC[ELEC.length - 1]; }
PAGES.elec = () => {
  const mast = ELEC.filter(l => lessonStatus(l.id) === 'mastered').length;
  const weak = ELEC.filter(l => lessonStatus(l.id) === 'review');
  const mins = S.elec.sessions.reduce((a, s) => a + s.min, 0);
  const m14 = S.elec.sessions.filter(s => daysBetween(s.date, nowInfo().op) < 14).reduce((a, s) => a + s.min, 0);
  const cl = currentLesson();
  const scores = Object.values(S.elec.best); const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  return `${pageHead('Electrical study', 'Helper → apprentice → journeyman')}
  <div class="stack" style="margin-top:14px">
    <div class="next"><span class="eyebrow">Next lesson</span><div class="title">${esc(cl.title)}</div><div class="small muted">${esc(ELEC_UNITS.find(u => u.id === cl.unit).title)}</div>
      <div class="btns"><button type="button" class="btn primary" data-a="go" data-tab="plan" data-page="elecSession">Start guided session</button><button type="button" class="btn" data-a="go" data-tab="plan" data-page="lesson" data-arg="${cl.id}">Just read it</button></div></div>
    <div class="kpis"><div class="kpi"><span class="eyebrow">Mastered</span><span class="v">${mast}<small>/${ELEC.length}</small></span></div><div class="kpi"><span class="eyebrow">Avg best quiz</span><span class="v">${avg != null ? avg + '%' : '–'}</span></div><div class="kpi"><span class="eyebrow">Study time</span><span class="v">${fmtDur(m14)}<small> / 14d</small></span><span class="small muted">${fmtDur(mins)} total</span></div></div>
    ${weak.length ? `<div class="card stack-s"><b>Needs review</b>${weak.map(l => `<div class="list-item" data-a="go" data-tab="plan" data-page="lesson" data-arg="${l.id}"><div class="grow">${esc(l.title)}</div><span class="st miss">${S.elec.best[l.id]}%</span></div>`).join('')}</div>` : ''}
    <div class="note small">This is study material, not authorization. Your employer’s procedures, your foreman and qualified electricians, and the applicable codes come first. Never do energized work or anything you are not trained and authorized for.</div>
    ${ELEC_UNITS.map(u => `<div class="section"><span class="eyebrow">${esc(u.title)}</span><div class="card">${ELEC.filter(l => l.unit === u.id).map(l => { const st = lessonStatus(l.id); return `<div class="list-item" data-a="go" data-tab="plan" data-page="lesson" data-arg="${l.id}"><div class="grow"><b>${esc(l.title)}</b>${S.elec.notes[l.id] ? '<div class="small faint">Has notes</div>' : ''}</div>${st === 'mastered' ? `<span class="st done">${S.elec.best[l.id]}%</span>` : st === 'review' ? `<span class="st miss">${S.elec.best[l.id]}%</span>` : '<span class="st">New</span>'}<span class="chev">›</span></div>`; }).join('')}</div></div>`).join('')}
    <div class="section"><span class="eyebrow">Trusted references</span><div class="card stack-s">${ELEC_REFS.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div></div>
  </div>`;
};
function quizHTML(l, prefix) {
  const q = ui.quiz && ui.quiz.id === l.id ? ui.quiz : (ui.quiz = { id: l.id, ans: {} });
  const answered = Object.keys(q.ans).length; const right = l.quiz.filter((x, i) => q.ans[i] === x.a).length;
  return `<div class="stack">${l.quiz.map((x, i) => { const a = q.ans[i]; return `<div class="q card"><b>${i + 1}. ${esc(x.q)}</b>${x.o.map((o, j) => `<button type="button" class="opt ${a != null ? (j === x.a ? 'right' : j === a ? 'wrong' : '') : ''}" data-a="qAns" data-i="${i}" data-j="${j}" ${a != null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}${a != null ? `<div class="small ${a === x.a ? '' : 'muted'}">${a === x.a ? 'Correct. ' : 'Not quite. '}${esc(x.why)}</div>` : ''}</div>`; }).join('')}
  ${answered === l.quiz.length ? `<div class="note ${pct(right, l.quiz.length) >= 80 ? 'good' : 'warn'}"><b>${right}/${l.quiz.length} (${pct(right, l.quiz.length)}%)</b>. ${pct(right, l.quiz.length) >= 80 ? 'Mastered. This lesson counts as learned.' : 'Below 80%, so it stays on your review list. Reread the key points and try again later.'}</div><button type="button" class="btn sm" data-a="qReset">Retake</button>` : ''}</div>`;
}
A.qAns = d => {
  const l = ELEC.find(x => x.id === ui.quiz.id); const i = +d.i, j = +d.j; if (ui.quiz.ans[i] != null) return;
  ui.quiz.ans[i] = j; const qid = l.id + ':' + i; const s = S.elec.qs[qid] = S.elec.qs[qid] || { r: 0, w: 0 };
  if (j === l.quiz[i].a) s.r++; else s.w++; s.last = Date.now();
  if (Object.keys(ui.quiz.ans).length === l.quiz.length) { const sc = pct(l.quiz.filter((x, k) => ui.quiz.ans[k] === x.a).length, l.quiz.length); S.elec.best[l.id] = Math.max(S.elec.best[l.id] || 0, sc); S.elec.last = S.elec.last || {}; S.elec.last[l.id] = sc; }
  save(); render();
};
A.qReset = () => { ui.quiz.ans = {}; render(); };
PAGES.lesson = id => {
  const l = ELEC.find(x => x.id === id) || ELEC[0];
  return `${pageHead(esc(l.title), esc(ELEC_UNITS.find(u => u.id === l.unit).title))}
  <div class="stack" style="margin-top:14px"><div class="card lesson-body">${l.body}</div>

  <label class="f">My notes<textarea id="lnote" data-live data-f="lnote" data-id="${l.id}" placeholder="Write it in your own words. Add questions to ask at work.">${esc(S.elec.notes[l.id] || '')}</textarea></label>

  ${(() => { const i = ELEC.indexOf(l); return `<div class="btns">${i > 0 ? `<button type="button" class="btn sm" data-a="go" data-tab="plan" data-page="lesson" data-arg="${ELEC[i - 1].id}">‹ ${esc(ELEC[i - 1].title)}</button>` : ''}${i < ELEC.length - 1 ? `<button type="button" class="btn sm" data-a="go" data-tab="plan" data-page="lesson" data-arg="${ELEC[i + 1].id}">${esc(ELEC[i + 1].title)} ›</button>` : ''}</div>`; })()}
  </div>`;
};
F.lnote = (v, el) => { S.elec.notes[el.dataset.id] = v; save(); };

const STAGES = [['Recall', 'Warm up your memory'], ['Learn', 'One concept'], ['Practice', 'Questions'], ['Summarize', 'Lock it in']];
PAGES.elecSession = arg => {
  const b = fromArg(arg); const total = b ? b.dur : 45;
  const plan = total >= 60 ? [5, 40, 20, 10] : total <= 30 ? [5, 12, 8, 5] : [5, 20, 10, 5];
  const es = ui.es = ui.es && ui.es.arg === arg ? ui.es : { arg, stage: 0, t0: Date.now(), st0: Date.now(), lesson: currentLesson().id, show: {}, summary: '' };
  const l = ELEC.find(x => x.id === es.lesson);
  const el = Math.round((Date.now() - es.st0) / 60000);
  let inner = '';
  if (es.stage === 0) {
    const missed = Object.entries(S.elec.qs).filter(([, s]) => s.w > s.r).map(([k]) => k).slice(0, 3);
    const prev = ELEC.filter(x => S.elec.best[x.id] != null && x.id !== l.id).slice(-2);
    const cards = missed.map(k => { const [lid, i] = k.split(':'); const L = ELEC.find(x => x.id === lid); const q = L && L.quiz[+i]; return q ? { q: q.q, a: q.o[q.a] + '. ' + q.why } : null; }).filter(Boolean);
    for (const p of prev) if (cards.length < 3) cards.push({ q: p.recall[0], a: p.keys.join(' · ') });
    if (!cards.length) cards.push({ q: `Before reading: what do you already know about “${l.title}”? Say one thing out loud.`, a: 'There is no wrong answer here. This just warms up your brain.' });
    inner = `<p class="small muted">Answer each from memory first. Then reveal.</p>${cards.map((c, i) => `<div class="card stack-s"><b>${esc(c.q)}</b>${es.show[i] ? `<div class="small">${esc(c.a)}</div>` : `<button type="button" class="btn sm" data-a="esShow" data-i="${i}">Show answer</button>`}</div>`).join('')}`;
  } else if (es.stage === 1) {
    inner = `<div class="card lesson-body">${l.body}</div><div class="card stack-s"><b>Key points</b>${l.keys.map(k => `<div class="small">• ${esc(k)}</div>`).join('')}</div>`;
  } else if (es.stage === 2) {
    inner = quizHTML(l);
  } else {
    inner = `<div class="card stack-s"><b>Recall prompts</b>${l.recall.map(k => `<div class="small">→ ${esc(k)}</div>`).join('')}</div>
      <label class="f">In 2–3 sentences: what did you learn, and one question to ask at work?<textarea id="esSum" data-live data-f="esSum">${esc(es.summary)}</textarea></label>`;
  }
  return `${pageHead('Study session', esc(l.title))}
  <div class="stack" style="margin-top:14px">
    <div class="stage">${STAGES.map((s, i) => `<i class="${i < es.stage ? 'done' : i === es.stage ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row between"><div><span class="eyebrow">Step ${es.stage + 1} of 4</span><h2>${STAGES[es.stage][0]}: ${STAGES[es.stage][1]}</h2></div><span class="chip mono">${el}/${plan[es.stage]} min</span></div>
    ${inner}
    <div class="btns">${es.stage > 0 ? '<button type="button" class="btn" data-a="esPrev">Back</button>' : ''}${es.stage < 3 ? '<button type="button" class="btn primary" data-a="esNext">Next step</button>' : '<button type="button" class="btn primary" data-a="esFinish">Finish session</button>'}</div>
    ${es.stage === 1 ? `<select id="esLesson" data-f="esLesson" aria-label="Choose lesson">${ELEC.map(x => `<option value="${x.id}" ${x.id === l.id ? 'selected' : ''}>${esc(x.title)} (${lessonStatus(x.id)})</option>`).join('')}</select>` : ''}
  </div>`;
};
A.esShow = d => { ui.es.show[d.i] = 1; render(); };
A.esNext = () => { ui.es.stage++; ui.es.st0 = Date.now(); if (ui.es.stage === 2) ui.quiz = null; render(); window.scrollTo(0, 0); };
A.esPrev = () => { ui.es.stage--; ui.es.st0 = Date.now(); render(); window.scrollTo(0, 0); };
F.esSum = v => { ui.es.summary = v; };
F.esLesson = v => { ui.es.lesson = v; ui.quiz = null; render(); };
A.esFinish = () => {
  const es = ui.es; const min = Math.max(1, Math.round((Date.now() - es.t0) / 60000)); const op = nowInfo().op;
  S.elec.sessions.push({ date: op, min, lesson: es.lesson });
  if (es.summary.trim()) S.elec.notes[es.lesson] = ((S.elec.notes[es.lesson] || '') + `\n[${op}] ${es.summary.trim()}`).trim();
  const b = fromArg(es.arg) || buildDay(op).blocks.map(z => ({ ...z, day: op })).find(z => z.cat === 'elec' && !z.status);
  if (b) markDone(b, min);

F.subEdit = (v, el) => { const s = S.study.subjects.find(x => x.id === el.dataset.id); s[el.dataset.k] = v; save(); };
F.subTmp = (v, el) => { ui.subTmp = ui.subTmp || {}; ui.subTmp[el.dataset.k] = v; };

A.subAddItem = d => {
  const s = S.study.subjects.find(x => x.id === d.id); const t = ui.subTmp || {};
  if (d.k === 'topic' && t.topic) s.topics.push({ t: t.topic.trim(), done: false });
  else if (d.k === 'q' && t.q) s.questions.push({ t: t.q.trim(), done: false });

/* ---------- Progress ---------- */
function vProgress() {
  const n = nowInfo(); const d14 = lastDays(14); const t14 = d14.filter(tracked);
  const stat = (cat, days) => { let p = 0, dn = 0, min = 0, act = 0; for (const s of days) for (const b of buildDay(s).blocks) { if (b.cat !== cat || b.src !== 'tpl') continue; if (absTime(s, b.start + b.dur) > n.ts && !b.status) continue; p++; min += b.dur; if (b.status === 'done') { dn++; act += (S.ov[b.key] && S.ov[b.key].actual) || b.dur; } } return { p, d: dn, min, act }; };
  const ex = stat('exercise', t14), el = stat('elec', t14), cl = stat('clean', t14), st = stat('study', t14);
  const shifts = shiftsIn(14), w14 = shifts.filter(s => S.att[s] && ['attended', 'late'].includes(S.att[s].status)).length;
  const s30 = shiftsIn(30), w30 = s30.filter(s => S.att[s] && ['attended', 'late'].includes(S.att[s].status)).length;
  const cis = d14.map(s => S.checkins[s]).filter(Boolean); const sl = cis.filter(c => c.sleepH != null);
  const avgSleep = sl.length ? sl.reduce((a, c) => a + c.sleepH, 0) / sl.length : null;
  const bedDev = (() => { const bs = sl.map(c => { let m = tm(c.bedAt); if (m < 720) m += DAY; return m; }); if (bs.length < 2) return null; const mu = bs.reduce((a, b) => a + b, 0) / bs.length; return Math.round(Math.sqrt(bs.reduce((a, b) => a + (b - mu) ** 2, 0) / bs.length)); })();
  const elQuizAvg = (() => { const v = Object.values(S.elec.best); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; })();
  const elMin = S.elec.sessions.filter(x => daysBetween(x.date, n.op) < 14).reduce((a, x) => a + x.min, 0);
  const stMin = S.study.subjects.reduce((a, s) => a + s.sessions.filter(x => daysBetween(x.date, n.op) < 14).reduce((q, x) => q + x.min, 0), 0);
  const lot = d14.map(s => lotusDay(s)); const lotUses = lot.reduce((a, x) => a + x.uses, 0); const lotUrges = lot.reduce((a, x) => a + x.urges, 0); const lotRode = lot.reduce((a, x) => a + x.rode, 0);
  const firstHalf = lot.slice(0, 7).reduce((a, x) => a + x.uses, 0), secondHalf = lot.slice(7).reduce((a, x) => a + x.uses, 0);
  const care = d14.filter(s => S.care[s] && CARE_MIN.every(([k]) => S.care[s][k])).length;
  const o = overschedule(t14); const moved = Object.entries(S.ov).filter(([k, v]) => v.moved && d14.includes(k.split('@')[1])).length;
  let plannedMin = 0, actualMin = 0; for (const s of t14) for (const b of buildDay(s).blocks) { if (b.src !== 'tpl') continue; if (absTime(s, b.start + b.dur) > n.ts && !b.status) continue; plannedMin += b.dur; if (b.status === 'done') actualMin += (S.ov[b.key] && S.ov[b.key].actual) || b.dur; }
  const rp = recoveryProgress();
  const kpi = (lbl, v, sub, frac) => `<div class="kpi"><span class="eyebrow">${lbl}</span><span class="v">${v}</span>${sub ? `<span class="small muted">${sub}</span>` : ''}${frac != null ? `<div class="bar ${frac >= .8 ? 'good' : ''}"><i style="width:${Math.round(frac * 100)}%"></i></div>` : ''}</div>`;
  const spark = (arr, cls) => `<div class="spark">${arr.map(v => `<i class="${v ? cls || '' : 'z'}" style="height:${v ? 100 : 6}%"></i>`).join('')}</div>`;
  const workDots = d14.map(s => { const d = buildDay(s); return d.work && S.att[s] && ['attended', 'late'].includes(S.att[s].status) ? 1 : 0; });
  return `<div class="stack" style="padding-top:10px"><h1>Progress</h1><p class="small muted">Last 14 days unless noted. Each area is measured on its own. These are recorded numbers, not a judgment.</p>
  <div class="kpis">
    ${kpi('Shifts worked · 14d', `${w14}<small>/${shifts.length}</small>`, `30d: ${w30}/${s30.length}${shifts.length - shifts.filter(s => S.att[s]).length ? ' · some not logged' : ''}`, shifts.length ? w14 / shifts.length : null)}
    ${kpi('Avg sleep', avgSleep != null ? avgSleep.toFixed(1) + '<small>h</small>' : '–', bedDev != null ? `bedtime varies ±${fmtDur(bedDev)}` : `${sl.length} check-ins`, avgSleep != null ? Math.min(1, avgSleep / 7.5) : null)}
    ${kpi('Exercise', `${ex.d}<small>/${ex.p}</small>`, `${S.ex.logs.filter(l => daysBetween(l.date, n.op) < 14).length} workouts logged`, ex.p ? ex.d / ex.p : null)}
    ${kpi('Electrical', `${fmtDur(elMin)}`, `${el.d}/${el.p} blocks · quiz avg ${elQuizAvg != null ? elQuizAvg + '%' : '–'}`, el.p ? el.d / el.p : null)}
    ${kpi('Personal study', `${fmtDur(stMin)}`, `${st.d}/${st.p} blocks`, st.p ? st.d / st.p : null)}
    ${kpi('Cleaning', `${cl.d}<small>/${cl.p}</small>`, `recovery list ${rp.pct}%`, cl.p ? cl.d / cl.p : null)}
    ${kpi('Blue lotus uses', `${lotUses}`, `wk1 ${firstHalf} → wk2 ${secondHalf} · urges ridden ${lotRode}/${lotUrges}`, null)}
    ${kpi('Care minimum', `${care}<small>/14 days</small>`, 'water, teeth, food, clothes, cats', care / 14)}
    ${kpi('Blocks', `${o.done}<small> done</small>`, `${o.skipped} skipped · ${o.missed} missed · ${moved} moved`, o.planned ? o.done / o.planned : null)}
    ${kpi('Planned vs actual', `${fmtDur(actualMin)}`, `of ${fmtDur(plannedMin)} planned`, plannedMin ? actualMin / plannedMin : null)}
  </div>
  <div class="card stack-s"><b>Shifts worked by day</b>${spark(workDots, 'g')}<div class="row between tiny faint"><span>${dateLabel(d14[0])}</span><span>Today</span></div></div>
  <div class="card stack-s"><b>Blue lotus uses by day</b><div class="spark">${lot.map(x => `<i class="${x.uses ? '' : 'z'}" style="height:${x.uses ? Math.max(10, x.uses / Math.max(1, ...lot.map(y => y.uses)) * 100) : 5}%"></i>`).join('')}</div></div>
  ${o.planned >= 6 && o.rate >= 0.4 ? `<div class="note warn">${Math.round(o.rate * 100)}% of past blocks in 14 days were skipped or missed. The plan may be bigger than your current capacity. Trim it in Settings → Routine template; a smaller plan you keep beats a big one you do not.</div>` : ''}
  ${painAlert()}
  </div>`;
}

A.icsExport = () => {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Shiftline//EN', 'CALSCALE:GREGORIAN'];
  const dt = (s, m) => { const t = new Date(absTime(s, m)); return `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}T${pad(t.getHours())}${pad(t.getMinutes())}00`; };
  const ev = (s, m, dur, title, alarm) => { L.push('BEGIN:VEVENT', `UID:${s}-${m}-${title.replace(/\W/g, '')}@shiftline`, `DTSTAMP:${dt(nowInfo().op, 720)}`, `DTSTART:${dt(s, m)}`, `DTEND:${dt(s, m + dur)}`, `SUMMARY:${title}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, `TRIGGER:-PT${alarm}M`, 'END:VALARM', 'END:VEVENT'); };
  for (let i = 0; i < 14; i++) { const s = addDays(nowInfo().op, i); const d = buildDay(s); ev(s, wakeMin(), 15, 'Wake up', 0); if (d.work) ev(s, d.depart, +S.settings.commute || 15, 'Leave for work', 10); ev(s, bedMin() - (+S.settings.windMin || 45), 15, 'Start winding down', 0); }
  L.push('END:VCALENDAR');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' })); a.download = 'shiftline-alarms.ics'; document.body.appendChild(a); a.click(); a.remove();
};

  <div class="card stack-s"><b>Not medical or legal advice</b><p>Exercise, pain, sleep, and substance features are self-tracking tools. For pain that is severe, persistent, worsening, or unexplained, or symptoms when cutting back, see a doctor or clinic. The attendance log cannot protect you from your employer’s policies. Electrical content is study material; your employer’s procedures, qualified supervision, and the applicable codes come first.</p></div>

try { pruneState(); } catch (e) { }
render();
initCloud();
setInterval(() => {
  const ae = document.activeElement; const typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if (!ui.sheet && !S.timer && !typing && document.visibilityState === 'visible' && (ui.tab === 'today' || (ui.tab === 'cal' && ui.cal === 'day'))) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}, 60000);

window.addEventListener('pagehide', () => saveLocal());
